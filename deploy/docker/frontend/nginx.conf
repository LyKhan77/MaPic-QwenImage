server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: rute klien tanpa file fisik jatuh ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset ber-hash boleh di-cache lama; index.html jangan (regex ini tidak
    # mencakup .html) supaya deploy baru langsung terpakai.
    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
